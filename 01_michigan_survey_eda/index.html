// Calculate empirical historical percentile
function historicalPercentile(value, historicalValues) {
  const valid = historicalValues.filter(Number.isFinite);
  if (!valid.length) return null;

  return 100 * valid.filter(v => v <= value).length / valid.length;
}

// Calculate standardized distance from historical average
function historicalDistance(values, historicalRows) {
  const zScores = [];

  responseLabels.forEach(label => {
    const series = historicalRows
      .map(r => r.values[label])
      .filter(Number.isFinite);

    const mean = series.reduce((a, b) => a + b, 0) / series.length;

    const variance = series.reduce(
      (sum, v) => sum + Math.pow(v - mean, 2), 0
    ) / series.length;

    const sd = Math.sqrt(variance);

    if (sd > 0) {
      zScores.push(Math.pow((values[label] - mean) / sd, 2));
    }
  });

  return zScores.length
    ? Math.sqrt(zScores.reduce((a, b) => a + b, 0) / zScores.length)
    : null;
}

// Build one interactive comparison table
function setupPilotTable(questionKey, magnitudeKey, selectId,
                         tableId, allId, clearId) {

  const historicalRows = data.monthly_shares[questionKey];

  const availability = new Map(
    data.monthly_availability.map(r => [
      String(r.YYYYMM), r
    ])
  );

  const select = document.getElementById(selectId);

  // Available months for this question
  const availableMonths = historicalRows
    .map(r => r.date.slice(0, 7));

  // Populate selectable list
  select.innerHTML = availableMonths.map(month =>
    `<option value="${month}" selected>${month}</option>`
  ).join('');

  function renderTable() {
    const selectedMonths = new Set(
      [...select.selectedOptions].map(o => o.value)
    );

    const selectedRows = historicalRows.filter(r =>
      selectedMonths.has(r.date.slice(0, 7))
    );

    const historicalIncrease = historicalRows.map(
      r => r.values['Go up']
    );

    const historicalDecrease = historicalRows.map(
      r => r.values['Go down']
    );

    const historicalDK = historicalRows.map(
      r => r.values["Don't know"]
    );

    const headers = [
      'Month',
      'Respondents',
      'Magnitude N',
      'Go up (%)',
      'Same (%)',
      'Go down (%)',
      "Don't know (%)",
      'Increase percentile',
      'Decrease percentile',
      'DK percentile',
      'Historical distance'
    ];

    const rows = selectedRows.map(r => {
      const month = r.date.slice(0, 7);
      const yyyymm = month.replace('-', '');
      const availabilityRow = availability.get(yyyymm) || {};

      const values = r.values;

      const n = availabilityRow[
        questionKey === 'GASPX1' ? 'A20' : 'A20b'
      ] ?? 0;

      const magnitudeN = availabilityRow[
        magnitudeKey === 'GASPX2' ? 'A20a' : 'A20c'
      ] ?? 0;

      const increaseP = historicalPercentile(
        values['Go up'], historicalIncrease
      );

      const decreaseP = historicalPercentile(
        values['Go down'], historicalDecrease
      );

      const dkP = historicalPercentile(
        values["Don't know"], historicalDK
      );

      const distance = historicalDistance(values, historicalRows);

      return [
        month,
        fmt(n),
        fmt(magnitudeN),
        values['Go up'].toFixed(2),
        values['Stay the same'].toFixed(2),
        values['Go down'].toFixed(2),
        values["Don't know"].toFixed(2),
        increaseP.toFixed(1),
        decreaseP.toFixed(1),
        dkP.toFixed(1),
        distance === null ? '—' : distance.toFixed(2)
      ];
    });

    document.getElementById(tableId).innerHTML =
      rows.length
        ? table(headers, rows)
        : '<p>No waves selected.</p>';
  }

  // Select all available waves
  document.getElementById(allId).addEventListener('click', () => {
    [...select.options].forEach(o => o.selected = true);
    renderTable();
  });

  // Clear selection
  document.getElementById(clearId).addEventListener('click', () => {
    [...select.options].forEach(o => o.selected = false);
    renderTable();
  });

  // Update table whenever selection changes
  select.addEventListener('change', renderTable);

  renderTable();
}
